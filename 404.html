<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OK복덕방 — 페이지 이동 중</title>
<!-- GitHub Pages SPA 폴백: 해시 라우팅으로 리다이렉트 -->
<script>
  // GitHub Pages는 SPA를 지원하지 않으므로, 404를 index.html로 리다이렉트
  // sessionStorage에 경로 저장 후 index.html에서 복원
  var path = window.location.pathname;
  var search = window.location.search;
  var hash = window.location.hash;
  
  // 루트(/) 접근은 그냥 이동
  if (path === '/' || path === '') {
    window.location.replace('/');
  } else {
    // 경로를 해시로 변환하여 index.html로 이동
    // 예: /register → /#/register
    sessionStorage.setItem('spa_redirect', path + search);
    window.location.replace('/#' + path);
  }
</script>
<style>
  body { 
    font-family: 'Noto Sans KR', sans-serif; 
    display: flex; align-items: center; justify-content: center; 
    min-height: 100vh; margin: 0; background: #14213D; color: #fff;
  }
  .loading { text-align: center; }
  .spinner { width: 40px; height: 40px; border: 4px solid rgba(184,146,63,0.3); 
    border-top-color: #B8923F; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="loading">
    <div class="spinner"></div>
    <p>페이지 이동 중...</p>
  </div>
</body>
</html>
